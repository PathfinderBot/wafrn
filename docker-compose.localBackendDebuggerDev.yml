# Ok this is a compose that does not include nor frontend nor backend.
services:
  db:
    image: postgres:17
    #command: -c 'max_connections=500'
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      PGUSER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: wafrn
    volumes:
      - dbpg:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"

  redis:
    image: redis:8.4
    restart: unless-stopped
    volumes:
      - redis:/data
    ports:
      - "8001:8001"
      - "8070:8070"
      - "6379:6379"

  bullboard:
    container_name: bullboard
    image: nauverse/bull-board
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis:6379
      BULL_PREFIX: bull
    depends_on:
      - redis

volumes:
  dbpg:
  redis:
  cache:

networks:
  default:
    enable_ipv6: true
