@let ask = this.ask();
@if (ask) {
  <div class="ask-container">
    <div class="ask-content">
      <div class="ask-header">
        <span class="ask-user">
          @let user = ask.user;
          @if (user) {
            <a [routerLink]="'/blog/' + user.url" class="subtle-link">{{ user.url }}</a>
          } @else {
            Anonymous
          }
        </span>
        asked:
      </div>
      <p class="ask-text" [innerHTML]="ask.question"></p>
    </div>
    <div class="ask-avatar">
      <app-avatar-small [user]="ask.user" class="ask-avatar"></app-avatar-small>
    </div>
  </div>
}
