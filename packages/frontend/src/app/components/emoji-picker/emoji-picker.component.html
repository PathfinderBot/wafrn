<div class="p-1 emojireact-overlay">
  <div class="mb-2 emojireact-overlay-header">
    <p class="text-xs"
      ><i>{{ 'emoji.reactionsUnsupported' | translate }}</i></p
    >
    <button
      title="{{ 'dialog.close' | translate }}"
      mat-stroked-button
      (click)="closeDialog()"
      class="mat-circle-button"
    >
      <fa-icon [icon]="faClose"></fa-icon>
    </button>
  </div>
  <app-emoji-collections (emoji)="reactToPost($event)"></app-emoji-collections>
</div>
