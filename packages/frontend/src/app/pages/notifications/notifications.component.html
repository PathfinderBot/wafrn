<div class="mx-3 lg:mx-4 wafrn-container">
  <h2 class="my-3 text-3xl notifications-text">{{ 'notifications.title' | translate }}</h2>
</div>

@for (notification of notificationsToShow; track $index) {
  @defer (on viewport) {
    <app-single-notification [notification]="notification"></app-single-notification>
  } @placeholder {
    <div class="notification-placeholder"></div>
  }
  @if ($index % 19 === 0 && $index > 0) {
    <!--This element is the one that says NOTIFICATION LOAD TIME-->
  }
}

<div
  class="load-more-notifications-intersector"
  role="region"
  [attr.aria-label]="'notifications.loadingMore' | translate"
>
  <app-loader>notifications</app-loader>
</div>
