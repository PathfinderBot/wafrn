<mat-card class="p-3 mb-6 lg:mx-4 wafrn-container">
  <table mat-table [dataSource]="serverBlocks">
    <!-- Position Column -->
    <ng-container matColumnDef="muted">
      <th mat-header-cell *matHeaderCellDef>{{ 'blog.user' | translate }}</th>
      <td mat-cell *matCellDef="let element">
        {{ element.displayName }}
      </td>
    </ng-container>
    <!-- Definitions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>{{ 'common.actions' | translate }}</th>
      <td mat-cell *matCellDef="let element">
        <button (click)="unblockServer(element.id)" class="w-full" mat-flat-button color="accent">
          {{ 'blog.unblockServer' | translate }}
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  @if (false && ready) {
    <mat-paginator
      [pageSizeOptions]="[5, 10, 25, 50, 100]"
      showFirstLastButtons
      [attr.aria-label]="'blog.selectServerBlocksPage' | translate"
    >
    </mat-paginator>
  }
</mat-card>
