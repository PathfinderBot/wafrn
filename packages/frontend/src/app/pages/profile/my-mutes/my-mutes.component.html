<div class="mx-3 lg:mx-4 wafrn-container-wide">
  <h2 class="my-3 text-3xl">{{ 'menu.settings.mutedUsers' | translate }}</h2>
</div>
<mat-card class="p-3 mb-3 lg:mx-4 wafrn-container-wide">
  <mat-form-field class="w-full mat-form-field-no-padding">
    <mat-label>Search</mat-label>
    <input (input)="onInput($event)" matNativeControl spellcheck="false" />
  </mat-form-field>
  <table mat-table [dataSource]="mutes">
    <ng-container matColumnDef="user">
      <th mat-header-cell *matHeaderCellDef>User</th>
      <td mat-cell *matCellDef="let row">
        <a [blogLink]="row">
          <div class="flex gap-2 align-items-center">
            <app-avatar-small [user]="row"></app-avatar-small>
            {{ row.url }}
          </div>
        </a>
      </td>
    </ng-container>
    <ng-container matColumnDef="reason">
      <th mat-header-cell *matHeaderCellDef>Reason</th>
      <td mat-cell *matCellDef="let row">
        {{ row.reason }}
      </td>
    </ng-container>
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Date</th>
      <td mat-cell *matCellDef="let row">
        {{ row.createdAt | date: 'M/d/yy, h:mm:ss a' }}
      </td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        <button (click)="unmuteUser(row.id)" class="w-full" mat-flat-button color="accent">Unmute</button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
  <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons aria-label="Select page of muted users">
  </mat-paginator>
</mat-card>
