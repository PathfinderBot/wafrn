<div class="mx-3 lg:mx-4 wafrn-container">
  <h2 class="my-3 text-3xl asks-text">{{ 'asks.title' | translate }}</h2>
</div>
@if (loading) {
  <app-loader>{{ 'asks.loader' | translate }}</app-loader>
} @else {
  @for (ask of asks; track $index) {
    <mat-card class="p-3 m-2 mb-6 lg:mx-4 wafrn-container">
      <app-single-ask [ask]="ask"></app-single-ask>
      <button (click)="replyAsk(ask)" mat-flat-button class="w-full mt-2">{{ 'asks.answer' | translate }}</button>
      <button (click)="ignoreAsk(ask)" mat-stroked-button class="w-full mt-2">{{ 'asks.ignore' | translate }}</button>
    </mat-card>
  }
  @if (!loading && asks.length === 0) {
    <footer class="m-2 mb-6 lg:mx-4 wafrn-container asks-text">
      <p class="mb-4 text-lg">{{ 'asks.noAsks' | translate }}</p>
      @for (amount of [12, 11, 10, 9, 8]; track $index) {
        <marquee [attr.scrollamount]="amount" class="m-0 nobody-asked">{{ 'asks.nobodyAsked' | translate }}</marquee>
      }
    </footer>
  }
}
