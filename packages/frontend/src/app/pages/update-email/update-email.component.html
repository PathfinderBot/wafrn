<mat-card class="mb-6 lg:mx-4 mat-card-higher wafrn-container">
  <mat-card-header class="pb-3 wafrn-container-header">
    <mat-card-title class="flex gap-2"
      ><fa-icon [icon]="faEnvelope"></fa-icon
      ><span class="font-medium">{{ 'settings.changeEmailTitle' | translate }}</span></mat-card-title
    >
  </mat-card-header>
  <section class="my-6 mx-3 text-center">
    <span class="font-medium line-height-3">{{ 'settings.changeEmailDescription' | translate }}</span>
  </section>

  <div class="px-3" [ngClass]="{ 'opacity-50 pointer-events-none': loading }">
    <form [formGroup]="emailForm" (ngSubmit)="onSubmit()">
      <mat-form-field class="block w-full mb-3">
        <mat-label>{{ 'login.email' | translate }}</mat-label>
        <input formControlName="email" type="email" matInput />
      </mat-form-field>

      <mat-form-field class="block w-full mb-3">
        <mat-label>{{ 'login.password' | translate }}</mat-label>
        <input formControlName="password" [type]="showPassword ? 'text' : 'password'" matInput />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword ? ('login.hidePassword' | translate) : ('login.showPassword' | translate)"
          [attr.aria-pressed]="showPassword"
        >
          <fa-icon [icon]="showPassword ? faEyeSlash : faEye"></fa-icon>
        </button>
      </mat-form-field>

      <button
        [disabled]="!emailForm.valid || loading"
        type="submit"
        mat-flat-button
        color="primary"
        extended
        class="w-full border-round-md mt-4"
      >
        <span class="flex gap-2">{{ 'settings.changeEmail' | translate }}<fa-icon [icon]="icon"></fa-icon></span>
      </button>
    </form>
  </div>
  <section class="p-3 mt-3 wafrn-container-footer">
    <p class="m-0">
      {{ 'login.dontHaveAccount' | translate }}
      <a routerLink="/register">{{ 'login.register' | translate }}</a>
    </p>
  </section>
</mat-card>
