<div class="mx-3 lg:mx-4 wafrn-container">
  <h2 class="my-3 text-3xl">{{ 'admin.emailCampaign.title' | translate }}</h2>
</div>

<mat-card class="p-3 mb-6 lg:mx-4 wafrn-container">
  @if (!ready) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <mat-form-field class="w-full">
    <mat-label>{{ 'admin.emailCampaign.subject' | translate }}</mat-label>
    <input matInput [(ngModel)]="subject" [disabled]="!ready" />
  </mat-form-field>

  <mat-form-field class="w-full">
    <mat-label>{{ 'admin.emailCampaign.emailHtml' | translate }}</mat-label>
    <textarea matInput class="campaign-body" [(ngModel)]="body" [disabled]="!ready"></textarea>
  </mat-form-field>

  <button mat-flat-button color="primary" class="w-full" (click)="submit(true)" [disabled]="!canSubmit">
    {{ 'admin.emailCampaign.sendTest' | translate }}
  </button>

  <button mat-flat-button color="primary" class="w-full" (click)="submit(false)" [disabled]="!canSubmit">
    {{ 'admin.emailCampaign.sendCampaign' | translate }}
  </button>
</mat-card>
