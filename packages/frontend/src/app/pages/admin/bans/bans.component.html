<div class="mx-3 lg:mx-4 wafrn-container-wide">
  <h2 class="my-3 text-3xl">{{ 'menu.admin.bans' | translate }}</h2>
</div>
<div class="mb-3 lg:mx-4 wafrn-container-wide">
  <p>{{ 'admin.common.secondStepNotice' | translate }}</p>
  <button mat-stroked-button (click)="showBans = !showBans">{{ 'admin.bans.showBannedUsers' | translate }}</button>
</div>
<mat-card [class.hidden]="!showBans" class="p-3 mb-3 lg:mx-4 wafrn-container-wide">
  <mat-form-field class="w-full mat-form-field-no-padding">
    <mat-label>{{ 'common.search' | translate }}</mat-label>
    <input (input)="onChange($event)" matNativeControl spellcheck="false" />
  </mat-form-field>
  <div class="w-full overflow-x-auto">
    <table mat-table matSort [dataSource]="!loading ? bannedUsers.data : placeholderData">
      <ng-container matColumnDef="user">
        <th mat-header-cell mat-sort-header *matHeaderCellDef>{{ 'blog.user' | translate }}</th>
        <td mat-cell *matCellDef="let row">
          @if (row) {
            <a [routerLink]="'/blog/' + row.url">
              <div class="flex gap-2 align-items-center">
                <app-avatar-small [user]="row"></app-avatar-small>
                {{ row.url }}
              </div>
            </a>
          } @else {
            <div class="flex gap-2 align-items-center">
              <app-avatar-small [user]="undefined"></app-avatar-small>
              <mat-progress-bar class="placeholder" mode="indeterminate"></mat-progress-bar>
            </div>
          }
        </td>
      </ng-container>
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>{{ 'common.actions' | translate }}</th>
        <td mat-cell *matCellDef="let row">
          @if (row) {
            <button mat-flat-button class="primary" (click)="unban(row)">{{ 'admin.bans.unban' | translate }}</button>
          }
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="bannedUsersColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: bannedUsersColumns"></tr>
    </table>
  </div>
  <mat-paginator
    [pageSizeOptions]="[10, 25, 50, 100]"
    showFirstLastButtons
    [attr.aria-label]="'admin.bans.selectBanListPage' | translate"
  >
  </mat-paginator>
</mat-card>
