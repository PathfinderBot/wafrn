<div class="mx-3 lg:mx-4 wafrn-container">
  <h2 class="my-3 text-3xl">{{ 'menu.admin.inviteCodes' | translate }}</h2>
</div>

<mat-card class="p-3 mb-6 lg:mx-4 wafrn-container-wide">
  <button mat-flat-button color="primary" class="w-full mb-4" (click)="createInvite()">Create invite</button>

  <mat-form-field class="w-full">
    <mat-label>Filter invite codes</mat-label>
    <input matInput class="w-full" [(ngModel)]="dataSource.filter" />
  </mat-form-field>

  <div class="w-full overflow-x-auto">
    <table mat-table [dataSource]="dataSource" class="w-max">
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let element">
          <div class="flex gap-2">
            <button mat-flat-button (click)="copy(element.code, 'LINK')">Copy link</button>
            <button mat-flat-button (click)="copy(element.code)">Copy code</button>
          </div>
        </td>
      </ng-container>
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let element">
          {{ element.code }}
        </td>
      </ng-container>
      <ng-container matColumnDef="createdBy">
        <th mat-header-cell *matHeaderCellDef>Created by</th>
        <td mat-cell *matCellDef="let element">
          @{{ element.createdBy.url }}
        </td>
      </ng-container>
      <ng-container matColumnDef="expiresIn">
        <th mat-header-cell *matHeaderCellDef>Expires in</th>
        <td mat-cell *matCellDef="let element">
          {{ element.expiresIn }}
        </td>
      </ng-container>
      <ng-container matColumnDef="usedBy">
        <th mat-header-cell *matHeaderCellDef>Used by</th>
        <td mat-cell *matCellDef="let element">
          {{ element.usedBy ? '@' + element.usedBy.url : 'NONE' }}
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>

  <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons
    aria-label="Select page of periodic elements">
  </mat-paginator>
</mat-card>
