<div class="mx-3 lg:mx-4 wafrn-container">
  <h2 class="my-3 text-3xl">{{ 'menu.admin.addEmojis' | translate }}</h2>
</div>

<mat-card class="p-3 m-2 mb-6 lg:mx-4 wafrn-container">
  <p>{{ 'admin.emojiUploader.description' | translate }}</p>
  <div class="flex align-items-center">
    <div class="w-min">
      <app-file-upload
        [config]="{
          url: '/admin/addEmoji',
          formats: 'application/zip',
          buttonText: ('admin.emojiUploader.uploadEmojis' | translate),
          formdataName: 'emoji'
        }"
        (fileUpload)="onEmojiUpload($event)"
      ></app-file-upload>
    </div>
    {{ 'admin.emojiUploader.uploadButtonHint' | translate }}
  </div>
  <hr />
  <p>{{ 'admin.emojiUploader.collectionsPreview' | translate }}</p>
  <app-emoji-collections></app-emoji-collections>
</mat-card>
