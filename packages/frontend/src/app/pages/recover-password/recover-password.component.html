<mat-card class="p-3 mb-6 lg:mx-4 wafrn-container">
  <div class="text-center mb-5">
    <img loading="lazy" [src]="logo" alt="{{ 'common.logoAlt' | translate }}" height="50" class="mb-3" />
    <p class="text-3xl font-medium mb-3">{{ 'login.recoverPasswordTitle' | translate }}</p>
    <p class="font-medium line-height-3">{{ 'login.recoverPasswordManager' | translate }}</p>
    <p>
      <span class="font-medium line-height-3">{{ 'login.dontHaveAccount' | translate }}</span>
      <a routerLink="/register" class="font-medium ml-2">{{ 'login.register' | translate }}</a>
    </p>
    <p>
      <span class="font-medium line-height-3">{{ 'login.rememberedPassword' | translate }}</span>
      <a routerLink="/" class="font-medium ml-2">{{ 'login.loginNow' | translate }}</a>
    </p>
  </div>

  <form [hidden]="loading" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <mat-form-field class="w-full">
      <mat-label>{{ 'login.email' | translate }}</mat-label>
      <input formControlName="email" type="text" matInput />
    </mat-form-field>
    <button
      [disabled]="loading || !loginForm.valid"
      mat-flat-button
      color="primary"
      extended
      class="w-full border-round-md mt-4"
    >
      <fa-icon [icon]="icon"></fa-icon>
      {{ 'login.requestPasswordReset' | translate }}
    </button>
  </form>
</mat-card>
