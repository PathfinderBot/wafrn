# DO NOT EDIT THIS FILE
# ANY CHANGE YOU DO MIGHT BE REVERTED DURING AN UPDATE
# Edit values on the .env file
# If the value you need to edit is hardcoded, please create a PR fixing it

# ATTENTION: NEXT VERSIONS OF THIS FILE WILL BE ON GIT.
# RIGHT NOW, NEXT UPDATE WILL DESTROY YOUR DOCKERCOMPOSE.



# Shared logging configuration for all services (max log size 100mb)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

services:
  frontend:
    restart: unless-stopped
    image: codeberg.org/wafrn/wafrn-frontend:${IMAGE_TAG:-main}
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    env_file: .env
    logging: *default-logging
    environment:
      BACKEND_HOST: "${BACKEND_HOST:-wafrn-backend-1:9000 wafrn-backend-2:9000 wafrn-backend-3:9000}"
      WEBSOCKET_HOST: "wafrn-websocket-1:9000"
      AUTO_HTTPS_MODE: ${AUTO_HTTPS_MODE:-auto_https disable_redirects}
      MONITORING_DOMAIN: ${MONITORING_DOMAIN:-monitoring.${DOMAIN_NAME}}
      BULLBOARD_DOMAIN: ${BULLBOARD_DOMAIN:-bullboard.${DOMAIN_NAME}}
    volumes:
      - ./packages/frontend/runtime-overrides:/overrides
      - ./data/frontend:/var/www/html/frontend
      - ./packages/backend/uploads:/var/www/html/uploads
      - ./data/caddy:/data/caddy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443

  backend: &default_backend
    image: codeberg.org/wafrn/wafrn-backend:${IMAGE_TAG:-main}
    build: &default_backend_build
      context: .
      dockerfile: packages/backend/Dockerfile
      # these args configure private env vars for the backend and public env vars for the frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      frontend:
        condition: service_started
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    env_file: .env
    logging: *default-logging
    environment: &default_backend_env_vars
      FRONTEND_FQDN_URL: https://${DOMAIN_NAME}
      FRONTEND_MEDIA_URL: ${FRONTEND_MEDIA_URL:-https://${MEDIA_DOMAIN}}
      FRONTEND_CACHE_URL: ${FRONTEND_CACHE_URL:-https://${CACHE_DOMAIN}/api/cache?media=}
      USE_WORKERS: ${USE_WORKERS:-false}

    deploy:
      mode: replicated
      replicas: ${BACKEND_REPLICAS:-3}
    volumes:
      - ./packages/backend/uploads:/app/packages/backend/uploads
      - cache:/app/packages/backend/cache
      - ./data/frontend:/app/packages/frontend:ro
  workers:
    <<: *default_backend
    build:
      <<: *default_backend_build
    environment:
      <<: *default_backend_env_vars
      USE_WORKERS: true
      FRONTEND_FQDN_URL: https://${DOMAIN_NAME}
      FRONTEND_MEDIA_URL: ${FRONTEND_MEDIA_URL:-https://${MEDIA_DOMAIN}}
      FRONTEND_CACHE_URL: ${FRONTEND_CACHE_URL:-https://${CACHE_DOMAIN}/api/cache?media=}
    deploy:
      mode: replicated
      replicas: ${WORKERS_REPLICAS:-3}

  websocket:
    <<: *default_backend
    deploy:
      mode: replicated
      replicas: 1
    command: "npm exec tsx websocket.ts"

  migration:
    <<: *default_backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      frontend:
        condition: service_started
    restart: no
    deploy:
      mode: replicated
      replicas: 1
    command: "npm exec tsx migrate.ts init-container"

  db:
    build:
      context: monitoring/database
      dockerfile: Dockerfile
    # command: -c 'max_connections=500'
    restart: unless-stopped
    shm_size: '${SHM_SIZE:-2gb}'
    env_file: .env
    logging: *default-logging
    environment:
      PGUSER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DBNAME}
    volumes:
      - ./data/dbpg:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:8.4
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./data/redis:/data

  pds:
    image: ghcr.io/bluesky-social/pds:0.4
    restart: unless-stopped
    logging: *default-logging
    ports:
      - ${PDS_HTTP_PORT:-127.0.0.1:3000}:3000
    profiles:
      - bluesky
    env_file: .env
    environment:
      PDS_HOSTNAME: ${PDS_DOMAIN_NAME}
      PDS_JWT_SECRET: ${PDS_JWT_SECRET}
      PDS_ADMIN_PASSWORD: ${PDS_ADMIN_PASSWORD}
      PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX: ${PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX}
      PDS_DATA_DIRECTORY: /pds
      PDS_BLOBSTORE_DISK_LOCATION: /pds/blocks
      PDS_BLOB_UPLOAD_LIMIT: 52428800
      PDS_DID_PLC_URL: "https://plc.directory"
      PDS_BSKY_APP_VIEW_URL: "https://api.bsky.app"
      PDS_BSKY_APP_VIEW_DID: "did:web:api.bsky.app"
      PDS_REPORT_SERVICE_URL: "https://mod.bsky.app"
      PDS_REPORT_SERVICE_DID: "did:plc:ar7c4by46qjdydhdevvrndac"
      PDS_CRAWLERS: "https://bsky.network"
      LOG_LEVEL: "debug"
      LOG_ENABLED: true
      PDS_EMAIL_SMTP_URL: "smtps://${SMTP_USER}:${SMTP_PASSWORD}@${SMTP_HOST}:${SMTP_PORT}"
      PDS_EMAIL_FROM_ADDRESS: "${SMTP_FROM}"
    volumes:
      - ./data/pds:/pds

  pds_worker:
    <<: *default_backend
    profiles:
      - bluesky
    deploy:
      mode: replicated
      replicas: 1
    command: "npm exec tsx atproto.ts"

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:latest
    profiles: [metrics]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./data/prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  cadvisor:
    restart: unless-stopped
    image: gcr.io/cadvisor/cadvisor:latest
    profiles: [metrics]
    command:
      - '-port=8081'
    environment:
      CADVISOR_HEALTHCHECK_URL: http://localhost:8081/healthz
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node-exporter:
    restart: unless-stopped
    image: prom/node-exporter:latest
    profiles: [metrics]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points="^/(sys|proc|dev|host|etc)($$|/)"'

  grafana:
    image: codeberg.org/wafrn/wafrn-grafana:${IMAGE_TAG:-main}
    build:
      context: monitoring/grafana
      dockerfile: Dockerfile
    volumes:
      - ./data/grafana_data:/var/lib/grafana
    restart: unless-stopped
    profiles: [metrics]
    env_file: .env
    logging: *default-logging
    environment:
      GF_SERVER_HTTP_PORT: 2345
      GF_USERS_ALLOW_SIGN_UP: false

      GF_SMTP_ENABLED: false

  pgwatch:
    build:
      context: monitoring/pgwatch
      dockerfile: Dockerfile
      args:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DBNAME}
    restart: unless-stopped
    logging: *default-logging
    profiles: [metrics]
    env_file: .env
    command:
      - "--web-disable=all"
      - "--sources=/sources.yaml"
      - "--sink=postgresql://${POSTGRES_METRICS_USER}:${POSTGRES_METRICS_PASSWORD}@db:5432/${POSTGRES_METRICS_DBNAME}"
    depends_on:
      db:
        condition: service_healthy

  bullboard:
    container_name: bullboard
    image: nauverse/bull-board
    restart: unless-stopped
    logging: *default-logging
    environment:
      REDIS_URL: redis:6379
      BULL_PREFIX: bull
      AUTH_REQUIRE: true
      USER_USERNAME: admin
      USER_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      - redis

volumes:
  cache:


networks:
  default:
    enable_ipv6: true
